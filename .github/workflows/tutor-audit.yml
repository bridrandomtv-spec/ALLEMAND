name: Audit tuteur IA — tests sans déploiement

on:
  push:
    branches: ["audit/lot-603-corpus-contract-tests"]
    paths:
      - "ia.js"
      - "biblio.js"
      - "js/qust.js"
      - "js/text-normalizer.js"
      - "parle.js"
      - "tests/voice_capture_contract.mjs"
      - "app.js"
      - "matieres.js"
      - "worker/ia-ask.js"
      - "rag.js"
      - "tools/sharder_index.py"
      - "tests/tutor_request_contract.mjs"
      - "tests/qust_runtime_contract.mjs"
      - "tests/biblio_grammar_runtime.mjs"
      - "assets/bdd/grammaire.json"
      - "tests/tutor_language_matrix.mjs"
      - "tests/english_subject_runtime.mjs"
      - "tests/tutor_matrix.json"
      - "assets/bdd/subjects.json"
      - "assets/bdd/matieres.json"
      - "assets/bdd/english_pages.json"
      - "assets/bdd/english_devoirs.json"
      - "assets/bdd/english_malakhiss.json"
      - "tests/rag_loader_contract.mjs"
      - "tests/rag_loader_runtime.mjs"
      - "tests/worker_request_runtime.mjs"
      - "tests/sharder_fixture.py"
      - ".github/workflows/tutor-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tutor-audit:
    name: Contrats tuteur, TTS, RAG et sharder
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Récupérer la branche d'audit
        uses: actions/checkout@v5

      - name: Installer Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Vérifier la syntaxe JavaScript
        run: |
          set -e
          node --check js/text-normalizer.js
          node --check js/qust.js
          node --check rag.js
          node --check app.js
          node --check matieres.js
          node --check ia.js
          node --check parle.js
          node --input-type=module --check < worker/ia-ask.js

      - name: Tester le verrouillage capture vocale / réponse IA
        run: node tests/voice_capture_contract.mjs

      - name: Tester le contrat commun chat / voix / Worker
        run: node tests/tutor_request_contract.mjs

      - name: Tester l’ingestion BIBLIO des règles grammaticales
        run: node tests/biblio_grammar_runtime.mjs

      - name: Tester le moteur QUST et son intégration au Worker
        run: node tests/qust_runtime_contract.mjs

      - name: Tester les heuristiques Darija / Arabizi / anglais / espagnol / italien
        run: node tests/tutor_language_matrix.mjs

      - name: Tester le routage des matières et l’isolation des corpus
        run: node tests/english_subject_runtime.mjs

      - name: Tester le contrat source du lecteur RAG
        run: node tests/rag_loader_contract.mjs

      - name: Tester le lecteur RAG en VM isolée
        run: node tests/rag_loader_runtime.mjs

      - name: Tester le Worker CERVEAU avec modèle simulé
        run: node tests/worker_request_runtime.mjs

      - name: Tester le sharder sur fixtures temporaires
        run: python tests/sharder_fixture.py

      - name: Récapitulatif — aucun déploiement
        run: echo "Tests d'audit uniquement. Aucun déploiement Cloudflare, aucune écriture Supabase."
