name: Tests PostgreSQL isolés — consentement Messenger

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  msg-invitation-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - name: Installer le client PostgreSQL
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Tester le cycle de vie et les garde-fous de consentement
        env:
          PGPASSWORD: postgres
        run: psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d postgres -f ci/msg-invitation-postgres-test.sql
      - name: Tester les courses concurrentes acceptation/annulation sur deux sessions PostgreSQL
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGDATABASE: postgres
          PGPASSWORD: postgres
        run: bash ci/msg-invitation-concurrency-test.sh
