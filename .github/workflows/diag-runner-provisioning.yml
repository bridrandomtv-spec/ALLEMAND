name: Diagnostic minimal du runner GitHub Actions

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/diag-runner-provisioning.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runner-smoke-test:
    name: Runner minimal (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - name: Confirmer le démarrage du runner sans checkout ni dépendance
        run: |
          echo "RUNNER_BOOTSTRAP_OK"
          echo "OS=${{ matrix.os }}"
          date -u
