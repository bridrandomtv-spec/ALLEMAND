                     '.oc-tab', '.off-head', '.ohn-n', '.exo-g', '.qrow', '.qr-i',
                     '.vf-row', '.vfb', '.ord-row', '.grille-box', '.gr-i', '.corr-i',
                     '.corr-r', 'v3.1')
          for k in CSS_REQ:
              if k not in css:
                  fails.append('style.css : ' + k + ' absent')
          if fails:
              print('::error::' + '; '.join(fails)); sys.exit(1)
          print('✅ 14 vues · 13 onglets statiques + 1 dynamique (profboard)')
          print('✅ Bareme 8+8+4 = 20 sur U1 → U6 = 48 seances')
          print('✅ Registre UNITES = 6 · espace parents multi-enfants · année 2AS bouclée (الفصل 1 + 2 + 3 complets)')
          print('✅ Multi-unites : getters DZ.DEVOIR/SEANCES + selectUnite + stockage isole')
          print('✅ Roles : allTabs() + isProf() + compte demo prof')
          print('✅ Salle en direct : flux video, chat IA, tableau 8 planches, presence 32')
          print('✅ Module BAC : minuteur 180 min derive, readiness 10/7, plan d action')
          print('✅ Espace parents : multi-enfants, rapport PDF/TXT, tarifs CIB/Edahabia')
          print('✅ Tableau de bord prof : 32 eleves, saisie I/II/III, CSV BOM')
          print('✅ Portail de connexion + 17 scripts dans l ordre + 5 polices')
          print('✅ CV professeur + methodologie 4 etapes + programme officiel MEN')
          print('✅ BDD : 684 fiches + 28 regles + classe + registre + archive BAC + live')
          print('✅ PWA v3.1 : manifest dir=rtl, 4 raccourcis, Service Worker')
          PY

  deploy:
    name: Déploiement GitHub Pages
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
