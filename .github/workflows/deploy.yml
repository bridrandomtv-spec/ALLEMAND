name: CI + Deploy — ALLEMAND

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  validate:
    name: Validation structurelle & pédagogique
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer esprima + pyyaml
        run: pip install --quiet esprima pyyaml

      - name: Vérifier les fichiers requis
        run: |
          set -e
          for f in index.html style.css auth.js bdd.js unite2.js unite3.js unite4.js \
                   unite5.js unite6.js unites3as_a.js unite10.js unite11.js unite12.js \
                   unite13.js unite14.js unite15.js unite16.js app.js modules.js live.js \
                   classe.js grammaire.js examen.js officiels.js stats.js quiz.js projet.js \
                   reservation.js journee.js prof.js parents.js library.js manifest.json \
                   sw.js README.md 404.html robots.txt sitemap.xml .nojekyll \
                   ci/check-unites.mjs matieres.js guide.js worker/resend-welcome.js memoire.js masar.js corpus.js rag.js malakhiss.js voix.js tour.js; do
              test -f "$f" || { echo "::error::Fichier manquant : $f"; exit 1; }
          done
          for a in assets/corriges.json assets/logo.png assets/prof.jpg \
                   assets/matching_v2.patch.js \
                   assets/bdd/referentiel.json assets/bdd/devoirs.json \
                   assets/bdd/compositions.json assets/bdd/bac.json \
                   assets/bdd/annales.json assets/bdd/grammaire.json \
                   assets/bdd/classe.json assets/bdd/eleves.json \
                   assets/bdd/bac_archive.json assets/bdd/live.json \
                   assets/bdd/parents.json assets/bdd/devoirs_officiels.json \
                   assets/bdd/wilayas_geo.json assets/bdd/plan_projet.json \
                   assets/bdd/journee.json assets/bdd/reservation.json assets/bdd/matieres.json assets/bdd/wilaya.json assets/bdd/onboarding.json assets/bdd/config.json assets/bdd/corpus.json assets/bdd/corpus_index.json assets/bdd/malakhiss.json; do
              test -f "$a" || { echo "::error::Asset manquant : $a"; exit 1; }
          done
          echo "✅ 36 fichiers racine + 22 assets présents"

      - name: Valider le YAML et les JSON
        run: |
          python - <<'PY'
          import glob, json, yaml
          for f in glob.glob('.github/workflows/*.yml'):
              yaml.safe_load(open(f, encoding='utf-8')); print('✅ YAML', f)
          for f in ('manifest.json', 'assets/corriges.json'):
              json.load(open(f, encoding='utf-8')); print('✅ JSON', f)
          PY

      - name: Valider la base documentaire (684 fiches)
        run: |
          python - <<'PY'
          import json, os, sys
          fails = []
          ref = json.load(open('assets/bdd/referentiel.json', encoding='utf-8'))
          ritems = ref.get('items', {})
          if not isinstance(ritems, dict):
              fails.append('referentiel.json : items doit etre un objet')
          for cle in ('wilayas', 'niveaux', 'filieres', 'types', 'unites_2AS',
                      'unites_3AS', 'annees_scolaires', 'difficulte'):
              if cle not in ritems:
                  fails.append('referentiel.json : cle ' + cle + ' absente')
          if len(ritems.get('wilayas', [])) != 58:
              fails.append('referentiel : ' + str(len(ritems.get('wilayas', []))) + '/58 wilayas')
          total, types, wil = 0, {}, set()
          REQ = ('id', 'type', 'titre', 'annee_scolaire', 'niveau', 'wilaya',
                 'unite', 'bareme', 'duree_minutes', 'sujet')
          for f in ('devoirs', 'compositions', 'bac', 'annales'):
              p = 'assets/bdd/' + f + '.json'
              if not os.path.exists(p):
                  fails.append(p + ' manquant'); continue
              items = json.load(open(p, encoding='utf-8'))['items']
              total += len(items); types[f] = len(items)
              for it in items:
                  miss = [k for k in REQ if k not in it or it[k] in (None, '')]
                  if miss:
                      fails.append(str(it.get('id', '?')) + ' champs ' + str(miss)); break
                  if it['bareme'] != 20:
                      fails.append(it['id'] + ' bareme != 20'); break
                  if sum(x['points'] for x in it['parties']) != 20:
                      fails.append(it['id'] + ' parties != 20'); break
                  if it['corrige_inclus'] and not it.get('corrige'):
                      fails.append(it['id'] + ' corrige_inclus sans contenu'); break
                  wil.add(it['code_wilaya'])
          if total < 600:
              fails.append('corpus trop petit : ' + str(total))
          if len(wil) < 58:
              fails.append(str(len(wil)) + '/58 wilayas couvertes')
          print('   repartition :', types)
          print('✅ ' + str(total) + ' fiches · ' + str(len(wil)) + '/58 wilayas')
          if fails:
              print('::error::' + ' | '.join(fails[:6])); sys.exit(1)
          PY

      - name: Valider l'archive BAC 2010-2026 (68 sujets)
        run: |
          python - <<'PY'
          import json, sys
          fails = []
          ar = json.load(open('assets/bdd/bac_archive.json', encoding='utf-8'))
          m = ar['_meta']; sj = ar['sujets']
          if m['annee_min'] != 2010 or m['annee_max'] != 2026:
              fails.append('archive : annees ' + str(m['annee_min']) + '-' + str(m['annee_max']))
          if len(sj) != 68:
              fails.append('archive : ' + str(len(sj)) + ' sujets != 68')
          if len(ar['annees']) != 17:
              fails.append('archive : ' + str(len(ar['annees'])) + ' annees != 17')
          if m['duree_officielle'] != 180:
              fails.append('archive : duree != 180 min')
          if m['bareme'] != {'I': 8, 'II': 8, 'III': 4, 'total': 20}:
              fails.append('archive : bareme != I/8 II/8 III/4 = 20')
          if m['seuils_readiness'] != {'pret': 10, 'a_consolider': 7}:
              fails.append('archive : seuils readiness != 10 / 7')
          ids = set(); par_an = {}
          for s in sj:
              for k in ('id', 'annee', 'session', 'theme_de', 'theme_ar', 'wilaya',
                        'filiere', 'duree_minutes', 'bareme', 'coefficient',
                        'parties', 'corrige', 'stats', 'source', 'niveau_cefr'):
                  if k not in s or s[k] in (None, ''):
                      fails.append(str(s.get('id', '?')) + ' : ' + k + ' absent')
              if s['id'] in ids:
                  fails.append('archive : id duplique ' + s['id'])
              ids.add(s['id'])
              par_an[s['annee']] = par_an.get(s['annee'], 0) + 1
              if s['duree_minutes'] != 180 or s['bareme'] != 20:
                  fails.append(s['id'] + ' : duree/bareme non officiels')
              if len(s['parties']) != 3:
                  fails.append(s['id'] + ' : parties != 3'); continue
              pts = dict((p['id'], p['points']) for p in s['parties'])
              if pts != {'I': 8, 'II': 8, 'III': 4}:
                  fails.append(s['id'] + ' : repartition ' + str(pts))
              if sum(p['points'] for p in s['parties']) != 20:
                  fails.append(s['id'] + ' : somme != 20')
              qi = s['parties'][0]['questions']; qii = s['parties'][1]['questions']
              qiii = s['parties'][2]['questions']
              if len(qi) != 6 or len(qii) != 8 or len(qiii) != 1:
                  fails.append(s['id'] + ' : nb questions anormal')
              if sum(x['pts'] for x in qi) != 8:
                  fails.append(s['id'] + ' : partie I != 8 pts')
              if sum(x['pts'] for x in qii) != 8:
                  fails.append(s['id'] + ' : partie II != 8 pts')
              grille = qiii[0].get('grille') or []
              if abs(sum(float(g[1]) for g in grille) - 4.0) > 1e-9:
                  fails.append(s['id'] + ' : grille III != 4.0')
              if len(qiii[0].get('modele', '')) < 200:
                  fails.append(s['id'] + ' : modele de redaction trop court')
              if len(s['corrige']) < 400:
                  fails.append(s['id'] + ' : corrige trop court')
              if not s['corrige_inclus']:
                  fails.append(s['id'] + ' : corrige_inclus faux')
              for k in ('candidats', 'moyenne_nationale', 'taux_reussite_pct'):
                  if k not in s['stats']:
                      fails.append(s['id'] + ' : stats.' + k + ' absent')
              for q in qi + qii:
                  if q['type'] == 'qcm' and not (0 <= q['a'] < len(q['opts'])):
                      fails.append(s['id'] + '/' + q['id'] + ' : indice qcm hors plage')
                  if q['type'] == 'txt' and not q.get('key'):
                      fails.append(s['id'] + '/' + q['id'] + ' : mots-cles absents')
          if any(v != 4 for v in par_an.values()):
              fails.append('archive : toutes les annees n ont pas 4 sujets')
          if len(ids) != len(sj):
              fails.append('archive : identifiants non uniques')
          if not all(s['source'].startswith('الديوان') for s in sj):
              fails.append('archive : source ONEC manquante')
          themes = set(s['theme_de'] for s in sj)
          if len(themes) < 10:
              fails.append('archive : ' + str(len(themes)) + ' themes < 10')
          print('✅ Archive BAC : ' + str(len(sj)) + ' sujets · ' + str(len(ar['annees']))
                + ' cycles (2010-2026) · 4 sujets/annee · 180 min · I/8+II/8+III/4=20')
          print('   themes : ' + str(len(themes)) + ' · grammaire : '
                + str(len(ar['grammaire_ciblee'])) + ' · filieres : ' + str(len(ar['filieres'])))
          if fails:
              print('::error::' + ' | '.join(fails[:8])); sys.exit(1)
          PY

      - name: Valider grammaire + classe + registre élèves
        run: |
          python - <<'PY'
          import json, sys
          fails = []
          gm = json.load(open('assets/bdd/grammaire.json', encoding='utf-8'))
          items = gm['items']; chaps = gm['chapitres']
          if len(items) < 86:
              fails.append('grammaire : ' + str(len(items)) + ' regles != 83')
          if len(chaps) != 5:
              fails.append('grammaire : ' + str(len(chaps)) + ' chapitres != 5')
          PLANCHERS = {'2AS-T1': 16, '2AS-T2': 15, '2AS-T3': 14, '3AS-BAC': 18, 'BAC': 23}
          compte = {}
          for r in items:
              compte[r['chapitre']] = compte.get(r['chapitre'], 0) + 1
          for k, v in PLANCHERS.items():
              if compte.get(k, 0) < v:
                  fails.append('grammaire : chapitre ' + k + ' = ' + str(compte.get(k, 0)) + ' < plancher ' + str(v))
          decl = dict((c['id'], c['nombre']) for c in chaps)
          if decl != compte:
              fails.append('grammaire : chapitres declares ' + str(decl) + ' != reels ' + str(compte))
          if len(items) != sum(compte.values()):
              fails.append('grammaire : total != somme des cibles')
          for c in chaps:
              for k in ('id', 'icone', 'titre', 'sous_titre', 'nombre', 'cefr'):
                  if not c.get(k):
                      fails.append('grammaire chapitre ' + str(c.get('id')) + ' : ' + k + ' vide')
          nums = [r['num_global'] for r in items]
          if nums != list(range(1, len(items) + 1)):
              fails.append('grammaire : num_global non continu')
          if len(set(r['id'] for r in items)) != len(items):
              fails.append('grammaire : identifiants non uniques')
          cefrs = set(r['cefr'] for r in items)
          if not cefrs <= set(['A1', 'A2', 'B1', 'B2']):
              fails.append('grammaire : CEFR inconnus ' + str(cefrs))
          REQ = ('id', 'titre_de', 'titre_ar', 'explication', 'exemples',
                 'erreur_courante', 'astuce', 'cefr', 'chapitre', 'chapitre_titre',
                 'icone', 'ordre', 'num_global', 'niveau', 'trimestre', 'mots_cles')
          for r in items:
              for k in REQ:
                  if not r.get(k):
                      fails.append('regle ' + str(r.get('id')) + ' : ' + k + ' vide'); break
              if len(r.get('exemples') or []) < 4:
                  fails.append('regle ' + str(r.get('id')) + ' : moins de 4 exemples')
              if len(r.get('explication', '')) < 25:
                  fails.append('regle ' + str(r.get('id')) + ' : explication < 25 caracteres')
              if len(r.get('mots_cles') or []) < 3:
                  fails.append('regle ' + str(r.get('id')) + ' : moins de 3 mots-cles')
              if r.get('cefr') not in ('A1', 'A2', 'B1', 'B2'):
                  fails.append('regle ' + str(r.get('id')) + ' : CEFR ' + str(r.get('cefr')))
          mini = min(len(r.get('explication', '')) for r in items)
          print('✅ Grammaire : ' + str(len(items)) + ' regles · ' + str(len(chaps))
                + ' chapitres · CEFR ' + '/'.join(sorted(cefrs)) + ' · explication min '
                + str(mini) + ' car.')
          print('   repartition : ' + str(compte))
          cv = json.load(open('assets/bdd/classe.json', encoding='utf-8'))
          for k in ('sections', 'jours', 'jours_de', 'emploi', 'lecons', 'presence',
                    'notes', 'messages', 'profs', 'prochaine'):
              if k not in cv:
                  fails.append('classe.json : cle ' + k + ' absente')
          if len(cv.get('sections', [])) != 5:
              fails.append('classe : ' + str(len(cv.get('sections', []))) + ' sections != 5')
          if len(cv.get('lecons', [])) < 6:
              fails.append('classe : moins de 6 lecons')
          if len(cv.get('profs', [])) < 5:
              fails.append('classe : moins de 5 professeurs')
          for l in cv.get('lecons', []):
              for k in ('n', 'de', 'ar', 'objectifs', 'vocabulaire', 'grammaire', 'statut'):
                  if k not in l:
                      fails.append('lecon ' + str(l.get('n')) + ' : ' + k + ' absent')
          print('✅ Classe virtuelle : ' + str(len(cv['sections'])) + ' sections · '
                + str(len(cv['lecons'])) + ' lecons · ' + str(len(cv['presence']))
                + ' presences · ' + str(len(cv['notes'])) + ' notes · '
                + str(len(cv['messages'])) + ' messages · ' + str(len(cv['profs'])) + ' profs')
          el = json.load(open('assets/bdd/eleves.json', encoding='utf-8'))
          if len(el.get('eleves', [])) != 32:
              fails.append('eleves.json : ' + str(len(el.get('eleves', []))) + ' eleves != 32')
          bar = el['_meta']['bareme_officiel']
          if bar['I'] + bar['II'] + bar['III'] != bar['total'] or bar['total'] != 20:
              fails.append('eleves.json : bareme != 8+8+4=20')
          sr = el['_meta']['seuils_readiness']
          if sr.get('pret') != 10 or sr.get('a_consolider') != 7:
              fails.append('eleves.json : seuils != 10 / 7')
          if len(el.get('evaluations', [])) < 4:
              fails.append('eleves.json : moins de 4 evaluations')
          ids = set(); nwil = set()
          REQE = ('id', 'matricule', 'nom_complet', 'section', 'code_wilaya',
                  'ville', 'presence', 'notes')
          for e in el['eleves']:
              for k in REQE:
                  if k not in e:
                      fails.append('eleve ' + str(e.get('id', '?')) + ' : ' + k + ' absent')
              if e['id'] in ids:
                  fails.append('eleves.json : id duplique ' + e['id'])
              ids.add(e['id']); nwil.add(e['code_wilaya'])
              for eid, nt in e['notes'].items():
                  if nt is None:
                      continue
                  if abs(round(nt['I'] + nt['II'] + nt['III'], 1) - nt['total']) > 0.001:
                      fails.append(e['id'] + '/' + eid + ' : I+II+III != total')
                  if nt['I'] > 8 or nt['II'] > 8 or nt['III'] > 4:
                      fails.append(e['id'] + '/' + eid + ' : depassement de bareme')
          if len(nwil) < 5:
              fails.append('eleves.json : moins de 5 wilayas')
          print('✅ Registre : ' + str(len(el['eleves'])) + ' eleves · '
                + str(len(el['evaluations'])) + ' evaluations · bareme 8+8+4=20 · '
                + 'seuils 10/7 · ' + str(len(nwil)) + ' wilayas')
          if fails:
              print('::error::' + ' | '.join(fails[:6])); sys.exit(1)
          PY

      - name: Valider la session en direct (live.json)
        run: |
          python - <<'PY'
          import json, sys
          fails = []
          lv = json.load(open('assets/bdd/live.json', encoding='utf-8'))
          s = lv.get('session') or {}
          el = lv.get('eleves') or []
          pl = lv.get('planches') or []
          ch = lv.get('chat') or []
          ag = s.get('agenda') or []
          if len(el) != 32:
              fails.append('live : ' + str(len(el)) + ' eleves != 32')
          if len(set(e['id'] for e in el)) != len(el):
              fails.append('live : identifiants eleves non uniques')
          REQ = ('id', 'matricule', 'nom_complet', 'initiales', 'ville', 'statut',
                 'micro', 'cam', 'connexion', 'ping_ms', 'points', 'participation')
          for e in el:
              for k in REQ:
                  if k not in e:
                      fails.append('live eleve ' + str(e.get('id', '?')) + ' : ' + k + ' absent')
              if e.get('statut') not in ('present', 'retard', 'absent', 'absent_justifie'):
                  fails.append('live : statut inconnu ' + str(e.get('statut')))
              if not str(e.get('matricule', '')).startswith('DZ-2AS3-2026-'):
                  fails.append('live : matricule non conforme ' + str(e.get('matricule')))
          if [p['n'] for p in pl] != list(range(1, len(pl) + 1)):
              fails.append('live : planches mal numerotees')
          if len(pl) < 8:
              fails.append('live : ' + str(len(pl)) + ' planches < 8')
          for p in pl:
              for k in ('titre_de', 'titre_ar', 'contenu', 'exemples', 'regle'):
                  if not p.get(k):
                      fails.append('live planche ' + str(p.get('n')) + ' : ' + k + ' vide')
              if len(p.get('exemples') or []) < 3:
                  fails.append('live planche ' + str(p['n']) + ' : moins de 3 exemples'); break
          if sum(a['duree'] for a in ag) != s.get('duree_minutes', -1):
              fails.append('live : agenda != duree de la session')
          if s.get('presents', 0) != sum(1 for e in el if e['statut'] == 'present'):
              fails.append('live : compte presents incoherent')
          tot = s.get('presents', 0) + s.get('retards', 0) + s.get('absents', 0)
          if tot != s.get('effectif', -1):
              fails.append('live : presents + retards + absents != effectif')
          roles = set(c['role'] for c in ch)
          if roles != set(['prof', 'eleve', 'admin']):
              fails.append('live : roles du chat ' + str(roles))
          if sum(1 for c in ch if c.get('epingle')) < 3:
              fails.append('live : moins de 3 messages epingles')
          for c in ch:
              for k in ('de', 'init', 'role', 'temps', 'texte'):
                  if k not in c:
                      fails.append('live chat : cle ' + k + ' absente'); break
          for k in ('reactions', 'reponses_auto', 'reponse_defaut'):
              if not lv.get(k):
                  fails.append('live : ' + k + ' absent')
          for r in lv.get('reponses_auto', []):
              if len(r.get('k') or []) < 2 or not r.get('r'):
                  fails.append('live : reponse IA mal formee')
          if 'confidentialite' not in lv.get('_meta', {}):
              fails.append('live : declaration de confidentialite absente')
          if fails:
              print('::error::' + ' | '.join(fails[:8])); sys.exit(1)
          print('✅ Session live : ' + str(len(el)) + ' eleves (' + str(s.get('presents'))
                + ' presents, ' + str(s.get('retards')) + ' retards, '
                + str(s.get('absents')) + ' absents) · ' + str(len(pl)) + ' planches · '
                + str(len(ch)) + ' messages · ' + str(len(ag)) + ' etapes ('
                + str(sum(a['duree'] for a in ag)) + ' min)')
          print('   ' + str(s.get('lecon_de', '')) + ' — ' + str(s.get('theme', '')))
          PY

      - name: Valider l'espace parents (parents.json)
        run: |
          python - <<'PY'
          import json, sys
          fails = []
          pa = json.load(open('assets/bdd/parents.json', encoding='utf-8'))
          m = pa['_meta']; enf = pa['enfants']
          if m['seuils_readiness'] != {'pret': 10, 'a_consolider': 7}:
              fails.append('parents : seuils readiness != 10 / 7')
          if m['bareme'] != {'I': 8, 'II': 8, 'III': 4, 'total': 20}:
              fails.append('parents : bareme != 8+8+4=20')
          if 'confidentialite' not in m:
              fails.append('parents : declaration de confidentialite absente')
          if len(enf) < 2:
              fails.append('parents : moins de 2 enfants (multi-enfants)')
          for e in enf:
              REQE = ('id', 'matricule', 'nom_complet', 'section_ar', 'niveau', 'filiere',
                      'code_wilaya', 'ville', 'examens', 'presence', 'exercices',
                      'programme_officiel', 'lecons_officielles', 'examen_a_venir',
                      'appreciation_generale')
              for k in REQE:
                  if k not in e:
                      fails.append('enfant ' + str(e.get('id', '?')) + ' : ' + k + ' absent')
              if len(e.get('examens') or []) < 3:
                  fails.append(str(e.get('id')) + ' : moins de 3 examens')
              for x in e.get('examens') or []:
                  dd = x.get('detail') or {}
                  if dd:
                      tot = dd.get('I', 0) + dd.get('II', 0) + dd.get('III', 0)
                      if abs(tot - x['note']) > 0.001:
                          fails.append(str(e.get('id')) + '/' + str(x.get('id')) + ' : I+II+III != note')
                      if dd.get('I', 0) > 8 or dd.get('II', 0) > 8 or dd.get('III', 0) > 4:
                          fails.append(str(e.get('id')) + '/' + str(x.get('id')) + ' : depassement')
              if len(e.get('presence') or []) < 5:
                  fails.append(str(e.get('id')) + ' : moins de 5 releves de presence')
              for p in e.get('presence') or []:
                  for k in ('ok', 'jour', 'lecon', 'statut'):
                      if k not in p:
                          fails.append(str(e.get('id')) + ' presence : ' + k + ' absent')
              if len(e.get('programme_officiel') or []) != 3:
                  fails.append(str(e.get('id')) + ' : programme != 3 trimestres')
              st_ex = set(x['statut'] for x in (e.get('exercices') or []))
              if not st_ex.issubset(set(['termine', 'en_cours', 'verrouille'])):
                  fails.append(str(e.get('id')) + ' : statut exercice inconnu ' + str(st_ex))
          for k in ('prochaines_seances', 'messages_profs', 'profs_particuliers',
                    'tarifs', 'moyens_paiement', 'contact'):
              if not pa.get(k):
                  fails.append('parents.json : ' + k + ' absent')
          if len(pa.get('prochaines_seances') or []) < 3:
              fails.append('parents : moins de 3 seances a venir')
          for s in pa.get('prochaines_seances') or []:
