      - name: Valider la réservation de cours (reservation.json)
        run: |
          python - <<'PY'
          import json, sys
          fails = []
          rs = json.load(open('assets/bdd/reservation.json', encoding='utf-8'))
          m = rs['_meta']
          if m['frais_service_pct'] != 10:
              fails.append('reservation : frais de service ' + str(m['frais_service_pct']) + ' != 10')
          if m['delai_annulation_h'] != 24:
              fails.append('reservation : delai annulation != 24 h')
          if m['premiere_seance_gratuite_min'] != 30:
              fails.append('reservation : 1re seance gratuite != 30 min')
          if 'confidentialite' not in m:
              fails.append('reservation : confidentialite absente')
          if len(rs['profs']) != 6:
              fails.append('reservation : ' + str(len(rs['profs'])) + ' profs != 6')
          if len(set(p['id'] for p in rs['profs'])) != 6:
              fails.append('reservation : identifiants de profs dupliques')
          if len(set(p['init'] for p in rs['profs'])) != 6:
              fails.append('reservation : initiales de profs dupliquees')
          if len(rs['types_cours']) != 6:
              fails.append('reservation : ' + str(len(rs['types_cours'])) + ' types != 6')
          ids_t = set(t['id'] for t in rs['types_cours'])
          if len(ids_t) != 6:
              fails.append('reservation : identifiants de types dupliques')
          if [d['min'] for d in rs['durees']] != [30, 60, 90]:
              fails.append('reservation : durees != 30/60/90')
          if [d['coef'] for d in rs['durees']] != [0.55, 1.0, 1.4]:
              fails.append('reservation : coefficients != 0.55/1.0/1.4')
          if [c['h'] for c in rs['creneaux']] != ['14:00','15:00','16:00','17:00','18:00','19:00']:
              fails.append('reservation : creneaux != 14:00-19:00')
          if len(rs['statuts']) != 4:
              fails.append('reservation : ' + str(len(rs['statuts'])) + ' statuts != 4')
          for p in rs['profs']:
              for k in ('id', 'init', 'nom', 'ville', 'exp_n', 'note_n', 'avis_n',
                        'prix_n', 'desc', 'tags', 'types'):
                  if k not in p or p[k] in (None, '', []):
                      fails.append('reservation prof ' + str(p.get('id')) + ' : ' + k + ' vide')
              if not (1000 <= p['prix_n'] <= 5000):
                  fails.append('reservation ' + p['id'] + ' : prix hors plage 1000-5000 DA')
              if p.get('avis_n', 0) not in (0, 0.0) and not (3.0 <= p['note_n'] <= 5.0):
                  fails.append('reservation ' + p['id'] + ' : note hors plage 3.0-5.0')
              if len(p.get('types') or []) < 3:
                  fails.append('reservation ' + p['id'] + ' : moins de 3 types de cours')
              if len(p.get('tags') or []) < 3:
                  fails.append('reservation ' + p['id'] + ' : moins de 3 specialites')
              inconnus = set(p.get('types') or []) - ids_t
              if inconnus:
                  fails.append('reservation ' + p['id'] + ' : types inconnus ' + str(inconnus))
          if sum(1 for p in rs['profs'] if p.get('fondateur')) != 1:
              fails.append('reservation : != 1 fondateur identifie')
          cv = json.load(open('assets/bdd/classe.json', encoding='utf-8'))
          pa = json.load(open('assets/bdd/parents.json', encoding='utf-8'))
          def nc(x):
              return x['nom'].replace('الأستاذ ', '').replace('الأستاذة ', '')
          pc = dict((nc(x), x) for x in cv['profs'])
          pp = dict((x['nom'], x) for x in pa['profs_particuliers'])
          pr = dict((nc(x), x) for x in rs['profs'])
          commun = sorted(set(pc) & set(pp) & set(pr))
          if len(commun) < 3:
              fails.append('reservation : seulement ' + str(len(commun))
                               + ' fiches communes aux 3 fichiers profs')
          for nom in commun:
              for k in ('ville', 'exp_n', 'note_n', 'avis_n', 'prix_n'):
                  vals = [pc[nom].get(k), pp[nom].get(k), pr[nom].get(k)]
                  if len(set(vals)) != 1:
                      fails.append('reservation prof ' + nom + ' : ' + k + ' divergent '
                                   + str(vals) + ' (classe/parents/reservation)')
              if pc[nom].get('specialites') != pr[nom].get('tags'):
                  fails.append('reservation prof ' + nom + ' : specialites != tags')
          pct = m['frais_service_pct']
          for p in rs['profs']:
              for dd in rs['durees']:
                  cours = round(p['prix_n'] * dd['coef'])
                  frais = round(cours * pct / 100)
                  if cours + frais <= 0:
                      fails.append('reservation : total nul pour ' + p['id'] + ' ' + str(dd['min']))
          ex = m.get('exemple_maquette')
          if not ex:
              fails.append('reservation : exemple de la maquette non documente')
          prix = [p['prix_n'] for p in rs['profs']]
          print('✅ Reservation : ' + str(len(rs['profs'])) + ' profs ('
                + str(min(prix)) + '-' + str(max(prix)) + ' DA/h) · '
                + str(len(rs['types_cours'])) + ' types · 3 durees 30/60/90 · '
                + str(len(rs['creneaux'])) + ' creneaux · frais ' + str(pct) + ' % · '
                + 'annulation ' + str(m['delai_annulation_h']) + ' h')
          print('   coherence croisee : ' + str(len(commun))
                + ' fiches profs identiques dans classe/parents/reservation')
          if fails:
              print('::error::' + ' | '.join(fails[:8])); sys.exit(1)
          PY

      - name: Rejouer la suite de build T1-T6 du professeur
        run: |
          python - <<'PY'
          import json, re, sys
          fails = []
          res = []
          # ── T1 : workflow deploy.yml (clés requises) ──
          dy = open('.github/workflows/deploy.yml', encoding='utf-8').read()
          t1 = all(k in dy for k in ('actions/checkout@v4', 'actions/deploy-pages@v4',
                                     'github-pages'))
          res.append(('T1 Workflow deploy.yml (cles requises)', t1))
          # ── T2 : corrigés conformes au fichier du prof ──
          co = json.load(open('assets/corriges.json', encoding='utf-8'))
          t2 = (co.get('II.1_conjugaison') == ['bin', 'hast', 'sind', 'hat']
                and co.get('II.2_w_fragen') == ['Wie', 'Woher', 'Wo', 'Wie']
                and co.get('II.4_salutations') == ['Guten Morgen', 'Tschüs',
                                                   'Guten Abend', 'Auf Wiedersehen']
                and co.get('I.1_vrai_faux') == ['Falsch', 'Richtig', 'Richtig', 'Falsch'])
          res.append(('T2 Corriges conformes au fichier du prof', t2))
          # ── T3 : quiz aligné sur les corrigés (5/5) ──
          qz = open('quiz.js', encoding='utf-8').read()
          u1 = re.findall(r"\{\s*u:1,\s*q:'((?:[^'\\]|\\.)*?)',\s*\n\s*o:\[(.*?)\],\s*c:(\d+),",
                        qz, re.S)
          bonne = []
          for (_q, opts, ci) in u1:
              ol = re.findall(r"'((?:[^'\\]|\\.)*)'", opts)
              if len(ol) == 4:
                  bonne.append(ol[int(ci)])
          checks3 = [
              ('Q1 modele Ich heiße', str(co.get('III_modele', '')).startswith('Ich heiße')
               and any(b.startswith('Ich heiße') for b in bonne)),
              ('Q2 bin', 'bin' in bonne and co['II.1_conjugaison'][0] == 'bin'),
              ('Q3 Woher', 'Woher' in bonne and co['II.2_w_fragen'][1] == 'Woher'),
              ('Q4 Guten Abend', 'Guten Abend' in bonne
               and co['II.4_salutations'][2] == 'Guten Abend'),
              ('Q5 ordre', 'Ich bin 16 Jahre alt.' in bonne
               and co['II.3_ordre'][0] == 'Ich bin 16 Jahre alt.'),
          ]
          t3 = all(o for (_n, o) in checks3)
          res.append(('T3 Quiz aligne sur les corriges (5/5)', t3))
          # ── T4 : moteur IA v2, 9 cas de référence ──
          pj = open('assets/matching_v2.patch.js', encoding='utf-8').read()
          ap = open('prof_core.js', encoding='utf-8').read() + "\n" + open('app.js', encoding='utf-8').read()
          i = ap.find('  base:[')
          j = ap.find('  fallback:[', i)
          base = []
          for m in re.finditer(r"\{t:'([^']*)',\s*k:\[(.*?)\],", ap[i:j], re.S):
              base.append((m.group(1), re.findall(r"'((?:[^'\\]|\\.)*)'", m.group(2))))
          def trouver(txt):
              s = (txt or '').lower()
              for (topic, kws) in base:
                  for k in kws:
                      if k.lower() in s:
                          return topic
              return None
          def par_racines(txt):
              n = re.sub(r'[\u064B-\u065F\u0670\u0640]', '', (txt or '').lower())
              for a in 'أإآٱ':
                  n = n.replace(a, 'ا')
              n = n.replace('ة', 'ه').replace('ى', 'ي').replace('ؤ', 'و').replace('ئ', 'ي')
              RAC = {'salutations': ['تحي', 'حيي', 'وداع', 'سلام', 'صباح', 'مساء', 'مرحبا'],
                     'exam': ['فرض', 'تحضير', 'امتحان', 'اختبار', 'بكالوريا'],
                     'wfragen': ['استفهام', 'اداه', 'أداة', 'woher', 'warum'],
                     'sein': ['يكون'], 'haben': ['يملك'],
                     'lena': ['لينا', 'نص', 'فهم']}
              for suj, rac in RAC.items():
                  if any(r in n for r in rac):
                      return suj
              return None
          CAS = [('اشرح لي الفعل sein', 'sein'), ('ما معنى haben؟', 'haben'),
                 ('اشرح لي نص Lena Fischer', 'lena'), ('كيف أحضر للفرض؟', 'exam'),
                 ('علمني التحيات بالألمانية', 'salutations'),
                 ('Guten Morgen signifie quoi؟', 'salutations'),
                 ('ما هي أدوات الاستفهام؟', 'wfragen'), ('Woher kommst du؟', 'wfragen'),
                 ('مرحبا أستاذ', 'default')]
          p4 = 0
          for (phrase, attendu) in CAS:
              obtenu = trouver(phrase) or par_racines(phrase) or 'default'
              if obtenu == attendu:
                  p4 += 1
          res.append(('T4 Moteur IA v2 : ' + str(p4) + '/9 cas', p4 == 9))
          # ── T5 : cohérence pédagogique (séances 60 min, grille /5, devoir /20) ──
          # T5 — les 3 rythmes de séance de la maquette (et non un seul)
          RYT5 = {'defaut': [5, 15, 15, 15, 10],
                  'lecture': [5, 5, 10, 15, 10, 10, 5],
                  'ecriture': [5, 10, 20, 10, 10, 5]}
          i_ep5 = ap.find('const ETAPES_PAR_TYPE = {')
          t5 = i_ep5 >= 0
          if not t5:
              fails.append('T5 : ETAPES_PAR_TYPE absent')
          for cle5, att5 in RYT5.items():
              ic5 = ap.find(cle5 + ': [', i_ep5) if i_ep5 >= 0 else -1
              if ic5 < 0:
                  t5 = False
                  fails.append('T5 : rythme ' + cle5 + ' absent')
                  continue
              rl5 = [int(x) for x in re.findall(r'm:(\d+)', ap[ic5:ap.find('],', ic5)])]
              if rl5 != att5 or sum(rl5) != 60:
                  t5 = False
                  fails.append('T5 : rythme ' + cle5 + ' ' + str(rl5) + ' != ' + str(att5))
          ig5 = ap.find('const GRILLE_S5')
          fg5 = ap.find('const GRILLE_S5_TOTAL', ig5)
          g5s = [int(p) for (_l, p) in re.findall(r"\['([^']+)',\s*(\d+),", ap[ig5:fg5])]
          iD5 = ap.find('const DEVOIR_U1 = {')
          iC5 = ap.find('const CORRIGE_U1 = {')
          dv5 = ap[iD5:iC5]
          p5 = {}
          for lbl5 in ('I', 'II', 'III'):
              q5 = dv5.find("{ id:'" + lbl5 + "', t:")
              m5 = re.search(r'pts:(\d+)', dv5[q5:q5 + 220]) if q5 >= 0 else None
              p5[lbl5] = int(m5.group(1)) if m5 else 0
          if sum(g5s) != 5 or len(g5s) != 4:
              t5 = False
              fails.append('T5 : grille /5 = ' + str(g5s))
          if p5 != {'I': 8, 'II': 8, 'III': 4} or sum(p5.values()) != 20:
              t5 = False
              fails.append('T5 : devoir /20 = ' + str(p5))
          if "Hôpital des erreurs" not in ap or "مستشفى الأخطاء" not in ap or ap.count("🏥 «") < 10:
              t5 = False
              fails.append('T5 : seance « Hopital des erreurs » absente ou < 10 patients')
          res.append(('T5 3 rythmes (5/7/6 etapes) + grille /5 + devoir /20 + S7', t5))
          # ── T6 : patch matching v2 (racine « تحي ») ──
          t6 = ('تحي' in pj) and ('findBestResponse' in pj)
          res.append(("T6 Patch matching v2 (racine 'تحي')", t6))
          for (label, ok) in res:
              print(('  ✅ ' if ok else '  ❌ ') + label)
              if not ok:
                  fails.append(label)
          if all(o for (_l, o) in res):
              print('✅ SUITE DE BUILD DU PROFESSEUR : 6/6 tests valides (T1 → T6)')
          else:
              print('::error::' + ' | '.join(fails[:6])); sys.exit(1)
          PY

