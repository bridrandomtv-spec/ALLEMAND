      - name: Contrôle pédagogique restructuré (9+10 unités, mesuré sur le livré)
        run: |
          python - <<'PY'
          import json, re, sys
          fails = []
          rd = lambda p: open(p, encoding='utf-8').read()
          app = rd('app.js'); idx = rd('index.html'); css = rd('style.css'); sw = rd('sw.js')
          qz = rd('quiz.js'); par = json.load(open('assets/bdd/parents.json', encoding='utf-8'))
          # ── registre : 19 unités (9×2AS + 10×3AS), sources réelles ──
          blk = re.search(r'const UNITES = \[(.*?)\n\];', app, re.S)
          if not blk: fails.append('app.js : registre UNITES introuvable')
          else:
              reg = blk.group(1)
              n_un = len(re.findall(r'\{\s*n:\d+', reg))
              if n_un != 19: fails.append('app.js : registre UNITES = ' + str(n_un) + ' au lieu de 19 (9×2AS + 10×3AS)')
              for s in ['SEANCES_U1','SEANCES_U2','SEANCES_U3','SEANCES_U4','SEANCES_U5','SEANCES_U6','SEANCES_U7','SEANCES_U8','SEANCES_U9']:
                  if s not in reg and s not in app: fails.append('app.js : source ' + s + ' absente')
              for s in ['UNITE10','UNITE11','UNITE12','UNITE13','UNITE14','UNITE15','UNITE16','UNITES_3AS_A']:
                  if s not in reg: fails.append('app.js : registre sans ' + s)
          # ── noms officiels des 9 Lektionen (et anciens noms interdits) ──
          NOMS9 = ['Sich vorstellen','Haus und Familie','Schule und Unterricht','Zeit und Wetter','Freizeit',
                   'Mensch und Gesundheit','Essen und Trinken','Aussehen und Charakter','Stadtleben']
          for nm in NOMS9:
              if nm not in app: fails.append('app.js : nom officiel absent : ' + nm)
          for old in ['Schule und Ausbildung','Alltag und Freizeit','Reisen und Verkehr','Familie und Freunde']:
              if old in app: fails.append('app.js : ancien nom présent : ' + old)
          # ── séances 2AS : mesurées dans app.js (SEANCES_U<n>), ≥5 par unité ──
          for u in range(1, 10):
              m2 = re.search(r'const SEANCES_U' + str(u) + r' = \[(.*?)\];', app, re.S)
              if not m2: fails.append('app.js : SEANCES_U' + str(u) + ' introuvable'); continue
              ns = len(re.findall(r'"n":\s*\d+|\{\s*n:\s*\d+', m2.group(1)))
              if ns < 5: fails.append('app.js : U' + str(u) + ' = ' + str(ns) + ' séances < 5')
          if 'DEVOIR_U1' not in app: fails.append('app.js : DEVOIR_U1 absent')
          if 'DEVOIRS_UNITE' not in app: fails.append('app.js : hook DEVOIRS_UNITE absent (devoirs biblio U2-U9)')
          # ── 3AS : fichiers unités présents et consommés ──
          for f in ['unite10.js','unite11.js','unite12.js','unite13.js','unite14.js','unite15.js','unite16.js','unites3as_a.js']:
              try:
                  fx = rd(f)
                  if 'seances' not in fx: fails.append(f + ' : aucune séance')
              except Exception: fails.append(f + ' : fichier introuvable')
          # ── index.html : carte programme 3AS + noms nouveaux + quiz 9 unités ──
          if 'السنة الثالثة ثانوي' not in idx: fails.append('index.html : section 3AS du programme absente')
          if 'Stadtleben' not in idx: fails.append('index.html : nom U9 absent de la carte programme')
          for old in ['Schule und Ausbildung','Alltag und Freizeit','Reisen und Verkehr']:
              if old in idx: fails.append('index.html : ancien nom présent : ' + old)
          if 'prof_core.js' not in idx: fails.append('index.html : prof_core.js non chargé')
          if idx.find('prof_core.js') > idx.find('src="app.js"'): fails.append('index.html : prof_core.js après app.js')
          uq = re.findall(r'\{\s*u:\s*(\d+)', qz)
          if len(uq) < 45 or min(map(int, uq)) < 1 or max(map(int, uq)) > 9: fails.append('quiz.js : banque hors 9 unités')
          # ── parents : multi-enfants conservé ──
          enf = par.get('enfants') or par.get('children') or []
          if len(enf) < 2: fails.append('parents.json : moins de 2 enfants')
          # ── CSS : bidi devoirs + règle [hidden] ──
          if 'unicode-bidi' not in css: fails.append('style.css : règle bidi absente')
          if '[hidden]' not in css or 'display:none' not in css: fails.append('style.css : règle [hidden] absente')
          # ── sw : version lue, pas devinée ──
          mv = re.search(r'dz-de-v(\d+)\.(\d+)\.(\d+)', sw)
          if not mv: fails.append('sw.js : version absente')
          print('✅ Contrôle pédagogique restructuré : registre 19 unités · 9 noms officiels · séances U1-U9 mesurées ·'
                ' 3AS 8 fichiers · carte programme 3AS · quiz 9 unités · parents 2 enfants · bidi + [hidden] · sw v'
                + (mv.group(1) + '.' + mv.group(2) + '.' + mv.group(3) if mv else '?'))
          if fails:
              print('::error::' + ' | '.join(fails[:10])); sys.exit(1)
          PY
