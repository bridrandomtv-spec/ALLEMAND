name: CI + Deploy — ALLEMAND

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  validate:
    name: Validation structurelle & pédagogique
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer esprima + pyyaml
        run: pip install --quiet esprima pyyaml

      - name: Vérifier les fichiers requis
        run: |
          set -e
          for f in index.html style.css auth.js bdd.js unite2.js app.js modules.js classe.js \
                   grammaire.js library.js prof.js manifest.json sw.js README.md 404.html \
                   robots.txt sitemap.xml .nojekyll; do
              test -f "$f" || { echo "::error::Fichier manquant : $f"; exit 1; }
          done
          for a in assets/corriges.json assets/logo.png assets/prof.jpg \
                   assets/bdd/referentiel.json assets/bdd/devoirs.json \
                   assets/bdd/compositions.json assets/bdd/bac.json \
                   assets/bdd/annales.json assets/bdd/grammaire.json \
                   assets/bdd/classe.json assets/bdd/eleves.json; do
              test -f "$a" || { echo "::error::Asset manquant : $a"; exit 1; }
          done
          echo "✅ 18 fichiers racine + 11 assets présents"

      - name: Valider le YAML
        run: |
          python - <<'PY'
          import glob, yaml
          for f in glob.glob('.github/workflows/*.yml'):
              yaml.safe_load(open(f, encoding='utf-8'))
              print('✅ YAML valide :', f)
          PY

      - name: Valider les JSON
        run: |
          python - <<'PY'
          import json
          for f in ('manifest.json', 'assets/corriges.json'):
              json.load(open(f, encoding='utf-8'))
              print('✅', f)
          PY

      - name: Valider la base documentaire (684 fiches)
        run: |
          python - <<'PY'
          import json, os, sys
          fails = []
          ref = json.load(open('assets/bdd/referentiel.json', encoding='utf-8'))
          ritems = ref.get('items', {})
          if not isinstance(ritems, dict):
              fails.append('referentiel.json : items doit etre un objet')
          for cle in ('wilayas', 'niveaux', 'filieres', 'types', 'unites_2AS',
                      'unites_3AS', 'annees_scolaires', 'difficulte'):
              if cle not in ritems:
                  fails.append('referentiel.json : cle ' + cle + ' absente')
          if len(ritems.get('wilayas', [])) != 58:
              fails.append('referentiel : ' + str(len(ritems.get('wilayas', []))) + '/58 wilayas')
          total, types, wil = 0, {}, set()
          REQ = ('id', 'type', 'titre', 'annee_scolaire', 'niveau', 'wilaya',
                 'unite', 'bareme', 'duree_minutes', 'sujet')
          for f in ('devoirs', 'compositions', 'bac', 'annales'):
              p = 'assets/bdd/' + f + '.json'
              if not os.path.exists(p):
                  fails.append(p + ' manquant'); continue
              items = json.load(open(p, encoding='utf-8'))['items']
              total += len(items); types[f] = len(items)
              for it in items:
                  miss = [k for k in REQ if k not in it or it[k] in (None, '')]
                  if miss:
                      fails.append(str(it.get('id', '?')) + ' champs manquants ' + str(miss)); break
                  if it['bareme'] != 20:
                      fails.append(it['id'] + ' bareme != 20'); break
                  if sum(x['points'] for x in it['parties']) != 20:
                      fails.append(it['id'] + ' parties != 20'); break
                  if it['corrige_inclus'] and not it.get('corrige'):
                      fails.append(it['id'] + ' corrige_inclus sans contenu'); break
                  wil.add(it['code_wilaya'])
          if total < 600:
              fails.append('corpus trop petit : ' + str(total))
          if len(wil) < 58:
              fails.append(str(len(wil)) + '/58 wilayas couvertes')
          print('   repartition :', types)
          print('✅ ' + str(total) + ' fiches · ' + str(len(wil)) + '/58 wilayas')
          if fails:
              print('::error::' + ' | '.join(fails[:6])); sys.exit(1)
          PY

      - name: Valider grammaire + classe + registre élèves
        run: |
          python - <<'PY'
          import json, sys
          fails = []
          gm = json.load(open('assets/bdd/grammaire.json', encoding='utf-8'))
          if len(gm['items']) < 25:
              fails.append('grammaire : ' + str(len(gm['items'])) + ' regles < 25')
          if len(gm['chapitres']) != 4:
              fails.append('grammaire : ' + str(len(gm['chapitres'])) + ' chapitres != 4')
          for r in gm['items']:
              for k in ('id', 'titre_de', 'titre_ar', 'explication', 'exemples',
                        'erreur_courante', 'astuce', 'cefr'):
                  if not r.get(k):
                      fails.append('regle ' + str(r.get('id')) + ' champ ' + k + ' vide'); break
              if len(r.get('exemples') or []) < 4:
                  fails.append('regle ' + r['id'] + ' moins de 4 exemples'); break
          print('✅ Grammaire : ' + str(len(gm['items'])) + ' regles · '
                + str(len(gm['chapitres'])) + ' chapitres · CEFR A1-B2')
          cv = json.load(open('assets/bdd/classe.json', encoding='utf-8'))
          for k in ('sections', 'jours', 'jours_de', 'emploi', 'lecons', 'presence',
                    'notes', 'messages', 'profs', 'prochaine'):
              if k not in cv:
                  fails.append('classe.json : cle ' + k + ' absente')
          if len(cv.get('sections', [])) != 5:
              fails.append('classe : sections != 5')
          if len(cv.get('lecons', [])) < 6:
              fails.append('classe : moins de 6 lecons')
          if len(cv.get('profs', [])) < 5:
              fails.append('classe : moins de 5 professeurs')
          for l in cv.get('lecons', []):
              for k in ('n', 'de', 'ar', 'objectifs', 'vocabulaire', 'grammaire', 'statut'):
                  if k not in l:
                      fails.append('lecon ' + str(l.get('n')) + ' : ' + k + ' absent')
          print('✅ Classe virtuelle : ' + str(len(cv['sections'])) + ' sections · '
                + str(len(cv['lecons'])) + ' lecons · ' + str(len(cv['presence'])) + ' presences · '
                + str(len(cv['notes'])) + ' notes · ' + str(len(cv['messages'])) + ' messages · '
                + str(len(cv['profs'])) + ' professeurs')
          el = json.load(open('assets/bdd/eleves.json', encoding='utf-8'))
          if len(el.get('eleves', [])) != 32:
              fails.append('eleves.json : ' + str(len(el.get('eleves', []))) + ' eleves != 32')
          bar = el['_meta']['bareme_officiel']
          if bar['I'] + bar['II'] + bar['III'] != bar['total'] or bar['total'] != 20:
              fails.append('eleves.json : bareme officiel != 8+8+4=20')
          sr = el['_meta']['seuils_readiness']
          if sr.get('pret') != 10 or sr.get('a_consolider') != 7:
              fails.append('eleves.json : seuils de readiness != 10 / 7')
          if len(el.get('evaluations', [])) < 4:
              fails.append('eleves.json : moins de 4 evaluations')
          ids = set(); nwil = set()
          REQE = ('id', 'matricule', 'nom_complet', 'section', 'code_wilaya',
                  'ville', 'presence', 'notes')
          for e in el['eleves']:
              for k in REQE:
                  if k not in e:
                      fails.append('eleve ' + str(e.get('id', '?')) + ' : ' + k + ' absent')
              if e['id'] in ids:
                  fails.append('eleves.json : id duplique ' + e['id'])
              ids.add(e['id']); nwil.add(e['code_wilaya'])
              for eid, nt in e['notes'].items():
                  if nt is None:
                      continue
                  if abs(round(nt['I'] + nt['II'] + nt['III'], 1) - nt['total']) > 0.001:
                      fails.append(e['id'] + '/' + eid + ' : I+II+III != total')
                  if nt['I'] > 8 or nt['II'] > 8 or nt['III'] > 4:
                      fails.append(e['id'] + '/' + eid + ' : depassement de bareme')
          if len(nwil) < 5:
              fails.append('eleves.json : moins de 5 wilayas representees')
          print('✅ Registre : ' + str(len(el['eleves'])) + ' eleves · '
                + str(len(el['evaluations'])) + ' evaluations · bareme 8+8+4=20 · '
                + 'seuils 10/7 · ' + str(len(nwil)) + ' wilayas')
          if fails:
              print('::error::' + ' | '.join(fails[:6])); sys.exit(1)
          PY

      - name: Valider la syntaxe JavaScript (esprima)
        run: |
          python - <<'PY'
          import esprima
          FICHIERS = ('auth.js', 'bdd.js', 'unite2.js', 'app.js', 'modules.js',
                      'classe.js', 'grammaire.js', 'library.js', 'prof.js', 'sw.js')
          for f in FICHIERS:
              esprima.parseScript(open(f, encoding='utf-8').read())
              print('✅', f)
          print('✅ ' + str(len(FICHIERS)) + '/10 fichiers JS valides')
          PY

      - name: Contrôle pédagogique, multi-unités, rôles & PWA
        run: |
          python - <<'PY'
          import json, re, sys
          fails = []
          def rd(p): return open(p, encoding='utf-8').read()
          app = rd('app.js'); mod = rd('modules.js'); u2 = rd('unite2.js')
          cl = rd('classe.js'); gr = rd('grammaire.js'); bdd = rd('bdd.js')
          lib = rd('library.js'); au = rd('auth.js'); sw = rd('sw.js'); pf = rd('prof.js')
          html = rd('index.html')
          man = json.load(open('manifest.json', encoding='utf-8'))
          cor = json.load(open('assets/corriges.json', encoding='utf-8'))
          dv = cor['devoir_unite_1']
          if sum(p['points'] for p in dv['parties']) != dv['total']:
              fails.append('bareme corriges.json incoherent')
          if len(cor['seances']) != 8:
              fails.append('corriges.json : seances != 8')
          APP_REQ = ('total:20', 'de-DE', 'window.DZ', 'function bootGate',
                     'function renderCompte', 'function selectUnite', 'function loadSeances',
                     'function uniteSelector', 'function paintUniteHead',
                     'get DEVOIR(){ return DEVOIR; }', 'get SEANCES(){ return SEANCES; }',
                     'function allTabs', 'function isProf', "'profboard'")
          for k in APP_REQ:
              if k not in app:
                  fails.append('app.js : ' + k + ' absent')
          if app.count('{ n:') < 8:
              fails.append('app.js : moins de 8 seances U1')
          if app.count('load(LS.seances') != 0:
              fails.append('app.js : reste des load(LS.seances) non migres')
          if not re.search(r'^let SEANCES = ', app, re.M):
              fails.append('app.js : SEANCES doit etre commutable (let)')
          for k in ('renderSim', 'renderParents', '45 * 60', '10 * 60',
                    'DZ.loadSeances()', 'new Proxy({}'):
              if k not in mod:
                  fails.append('modules.js : ' + k + ' absent')
          for k in ('SEANCES_U2', 'DEVOIR_U2', 'CORRIGE_U2', 'window.UNITE2',
                    'Possessivartikel', 'Adjektive', 'gefallen', 'Die Familie Sommer',
                    'Textproduktion', 'Konsolidierung'):
              if k not in u2:
                  fails.append('unite2.js : ' + k + ' absent')
          if u2.count('{ n:') < 8:
              fails.append('unite2.js : moins de 8 seances')
          parts = re.findall(r"\{\s*id:'(I|II|III)',\s*t:", u2)
          if len(parts) != 3:
              fails.append('unite2.js : devoir U2 a ' + str(len(parts)) + ' parties au lieu de 3')
          for k in ('function vueEmploi', 'function vueLecons', 'function vuePresence',
                    'function vueNotes', 'function vueMessages', 'function vueProfs',
                    'function rejoindre', 'assets/bdd/classe.json'):
              if k not in cl:
                  fails.append('classe.js : ' + k + ' absent')
          for k in ('function filtrer', 'function carte', 'function fiche',
                    'assets/bdd/grammaire.json'):
              if k not in gr:
                  fails.append('grammaire.js : ' + k + ' absent')
          if 'Object.prototype' in gr:
              fails.append('grammaire.js : pollution Object.prototype interdite')
          for k in ('function normalise', 'function search', 'function pages', 'assets/bdd/'):
              if k not in bdd:
                  fails.append('bdd.js : ' + k + ' absent')
          for k in ('function openFiche', 'function paintKPI', 'dz:view'):
              if k not in lib:
                  fails.append('library.js : ' + k + ' absent')
          for k in ('function login', 'function signup', 'SECTIONS', 'hash(',
                    "users['prof']"):
              if k not in au:
                  fails.append('auth.js : ' + k + ' absent')
          PROF_REQ = ('PRET = 10', 'CONS = 7', 'function calcTotal', 'function moyenneEleve',
                      'function readiness', 'toCSV', 'text/csv', 'function parWilaya',
                      'histogramme', 'dz_de_prof_audit_v1', 'accesAutorise',
                      'assets/bdd/eleves.json', "role === 'prof'")
          for k in PROF_REQ:
              if k not in pf:
                  fails.append('prof.js : ' + k + ' absent')
          BOM = chr(92) + 'uFEFF'
          if BOM not in pf:
              fails.append('prof.js : BOM UTF-8 (Excel) absent')
          for k in ("'install'", "'activate'", "'fetch'", 'dz-de-v2.3.0',
                    './unite2.js', './classe.js', './grammaire.js', './prof.js',
                    './assets/bdd/eleves.json'):
              if k not in sw:
                  fails.append('sw.js : ' + k + ' absent')
          if man.get('dir') != 'rtl':
              fails.append('manifest : dir != rtl')
          if not man.get('icons'):
              fails.append('manifest : aucune icone')
          if len(man.get('shortcuts', [])) < 4:
              fails.append('manifest : moins de 4 raccourcis')
          if html.count('data-view=') != 11:
              fails.append('index.html : ' + str(html.count('data-view=')) + ' vues != 11')
          for ident in ('id="gate"', 'id="shell"', 'id="profBody"',
                        'id="classeBody"', 'id="gramBody"', 'id="biblioBody"',
                        'id="seancesHead"', 'id="devoirTitle"', 'id="miniProf"'):
              if ident not in html:
                  fails.append('index.html : ' + ident + ' absent')
          ordre = re.findall(r'<script src="([^"]+)"', html)
          attendu = ['auth.js', 'bdd.js', 'unite2.js', 'app.js', 'modules.js',
                     'classe.js', 'grammaire.js', 'prof.js', 'library.js']
          if ordre != attendu:
              fails.append('index.html : ordre des scripts ' + str(ordre))
          for police in ('amiri', 'tajawal', 'reem-kufi', 'cormorant-garamond', 'inter'):
              if police not in html:
                  fails.append('index.html : police ' + police + ' absente')
          css = rd('style.css')
          for k in ('.prof-hero', '.tble', '.rchip', '.rbar', '.histo', '.wrow',
                    '.ninp', '.bareme-strip', '.alert-i'):
              if k not in css:
                  fails.append('style.css : ' + k + ' absent')
          if fails:
              print('::error::' + '; '.join(fails)); sys.exit(1)
          print('✅ Bareme 8+8+4 = 20 · 8 seances U1 + 8 seances U2')
          print('✅ Multi-unites : getters DZ.DEVOIR/SEANCES + selectUnite + stockage isole')
          print('✅ Roles : allTabs() + isProf() + compte demo prof')
          print('✅ Tableau de bord prof : 32 eleves, saisie I/II/III, readiness 10/7, CSV BOM')
          print('✅ Portail de connexion + 11 vues + ordre des 9 scripts')
          print('✅ 5 polices (Amiri/Tajawal/Reem Kufi/Cormorant/Inter)')
          print('✅ BDD : 684 fiches + 28 regles + classe + registre')
          print('✅ PWA v2.3 : manifest dir=rtl, 4 raccourcis, Service Worker')
          PY

  deploy:
    name: Déploiement GitHub Pages
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
