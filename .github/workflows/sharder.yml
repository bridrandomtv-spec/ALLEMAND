name: Sharder l'index RAG documentaire
on:
  push:
    paths:
      - 'tools/sharder_index.py'
      - 'assets/bdd/corpus_rag_index.json'
      - '.github/workflows/sharder.yml'
permissions:
  contents: write
jobs:
  shard:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Valider puis construire les shards
        run: python tools/sharder_index.py
      - name: Committer les shards sur la branche courante
        run: |
          git config user.name 'GitHub Actions'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/bdd/shards assets/bdd/shards_manifest.json
          git diff --cached --quiet || git commit -m 'build(corpus): publier les shards RAG validés'
          git push origin "HEAD:${GITHUB_REF_NAME}"
