name: Tests intégration Supabase local — Messenger

on:
  pull_request:
    branches: ["main"]
    paths:
      - "supabase/migrations/202611130001_msg_invitation_consent.sql"
      - "supabase/migrations/202611130003_msg_student_discovery.sql"
      - "ci/msg-supabase-local-bootstrap.sql"
      - "ci/msg-supabase-local-test.mjs"
      - ".github/workflows/msg-supabase-local-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  messenger-supabase-local:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Vérifier la syntaxe du test HTTP
        run: node --check ci/msg-supabase-local-test.mjs

      - name: Initialiser Supabase CLI local (version v2 épinglée)
        run: npx --yes supabase@2.122.1 init

      - name: Désactiver la confirmation e-mail uniquement pour les comptes synthétiques locaux
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path("supabase/config.toml")
          content = path.read_text()
          match = re.search(r"(?ms)^\[auth\.email\]\s*$([\s\S]*?)(?=^\[|\Z)", content)
          if not match or not re.search(r"(?m)^enable_confirmations\s*=", match.group(1)):
              raise SystemExit("La configuration Auth locale ne contient pas auth.email.enable_confirmations")
          section = re.sub(r"(?m)^enable_confirmations\s*=\s*\w+", "enable_confirmations = false", match.group(1), count=1)
          path.write_text(content[:match.start(1)] + section + content[match.end(1):])
          PY

      - name: Mettre temporairement les migrations de côté avant le démarrage
        run: |
          mkdir -p /tmp/allemand-supabase-migrations
          cp supabase/migrations/*.sql /tmp/allemand-supabase-migrations/
          rm supabase/migrations/*.sql

      - name: Démarrer Supabase local isolé
        run: npx --yes supabase@2.122.1 start -x studio,imgproxy,storage-api,edge-runtime,logflare,vector,supavisor,postgres-meta

      - name: Restaurer les migrations pour application explicite dans la base locale
        run: cp /tmp/allemand-supabase-migrations/*.sql supabase/migrations/

      - name: Exporter les clés éphémères de la pile locale
        shell: bash
        run: |
          eval "$(npx --yes supabase@2.122.1 status -o env)"
          {
            echo "API_URL=$API_URL"
            echo "DB_URL=$DB_URL"
            echo "ANON_KEY=$ANON_KEY"
            echo "SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"

      - name: Préparer un schéma Messenger synthétique
        run: psql "$DB_URL" -v ON_ERROR_STOP=1 -f ci/msg-supabase-local-bootstrap.sql

      - name: Appliquer les migrations Messenger uniquement dans Supabase local
        run: |
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/202611130001_msg_invitation_consent.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/202611130003_msg_student_discovery.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -c "NOTIFY pgrst, 'reload schema';"

      - name: Vérifier Auth GoTrue, JWT signés, RPC PostgREST et RLS avec deux élèves synthétiques
        run: node ci/msg-supabase-local-test.mjs

      - name: Arrêter la pile locale
        if: always()
        run: npx --yes supabase@2.122.1 stop
