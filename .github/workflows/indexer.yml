name: Indexer les PDF autorisés du corpus
on:
  workflow_dispatch:
  push:
    paths:
      - 'docs/archive/documents/**'
      - 'tools/indexer_pdf.py'
      - '.github/workflows/indexer.yml'
permissions:
  contents: write
jobs:
  index:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Installer le parseur PDF
        run: pip install -q pypdf
      - name: Tester le contrat du pipeline RAG
        run: python -m unittest tests/test_corpus_pipeline.py
      - name: Vérifier et indexer uniquement les PDF autorisés
        run: python tools/indexer_pdf.py docs/archive/documents
      - name: Committer le corpus RAG sur la branche courante
        run: |
          git config user.name 'GitHub Actions'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/bdd/corpus.json assets/bdd/corpus_rag_index.json
          git diff --cached --quiet || git commit -m 'build(corpus): générer le corpus RAG autorisé'
          git push origin "HEAD:${GITHUB_REF_NAME}"
