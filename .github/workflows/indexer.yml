name: Indexer les PDF du corpus
on:
  workflow_dispatch:
  push:
    paths:
      - 'docs/archive/documents/**'
      - 'tools/indexer_pdf.py'
permissions:
  contents: write
jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Installer tesseract + poppler (OCR)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-deu tesseract-ocr-ara poppler-utils
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Installer libs Python
        run: pip install -q pypdf pytesseract pdf2image Pillow
      - name: Extraire + OCR + indexer les PDF
        run: python tools/indexer_pdf.py docs/archive/documents
      - name: Committer le corpus indexe
        run: |
          git config user.name 'Prof. Kharif Ahmed'
          git config user.email 'bridrandomtv-spec@users.noreply.github.com'
          git add assets/bdd/corpus.json assets/bdd/corpus_index.json
          git diff --cached --quiet || git commit -m 'feat(corpus): indexation PDF + OCR des scans (tesseract deu+ara)'
          git push
